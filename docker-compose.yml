services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: invoiceflow
      POSTGRES_USER: invoiceflow
      POSTGRES_PASSWORD: invoiceflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoiceflow -d invoiceflow"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: .
    environment:
      DATABASE_URL: postgres://invoiceflow:invoiceflow@postgres:5432/invoiceflow?sslmode=disable
      API_ADDR: 0.0.0.0:8080
      MIGRATIONS_DIR: /app/db/migrations
      STORAGE_DIR: /data
      WEB_DIR: /app/web
      WEBHOOK_URL: http://receiver:8090/webhook
      WEBHOOK_MODE: controlled
      WEBHOOK_SECRET: local-demo-webhook-secret
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    volumes:
      - document_data:/data
  worker:
    build: .
    command: ["/app/invoiceflow-worker"]
    environment:
      DATABASE_URL: postgres://invoiceflow:invoiceflow@postgres:5432/invoiceflow?sslmode=disable
      MIGRATIONS_DIR: /app/db/migrations
      STORAGE_DIR: /data
      WEBHOOK_URL: http://receiver:8090/webhook
      WEBHOOK_MODE: controlled
      WEBHOOK_SECRET: local-demo-webhook-secret
      # Structured extractor. Defaults keep the offline fake path; set EXTRACTOR
      # and OPENAI_API_KEY in your environment (never commit a key) to opt in.
      EXTRACTOR: ${EXTRACTOR:-fake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    volumes:
      - document_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      receiver:
        condition: service_started
  receiver:
    build: .
    command: ["/app/invoiceflow-receiver"]
    environment:
      WEBHOOK_SECRET: local-demo-webhook-secret
    ports:
      - "127.0.0.1:${RECEIVER_HOST_PORT:-8090}:8090"
volumes:
  postgres_data:
  document_data:
