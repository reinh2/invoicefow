name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: invoiceflow
          POSTGRES_USER: invoiceflow
          POSTGRES_PASSWORD: invoiceflow
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U invoiceflow -d invoiceflow"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - run: make fmt
      - run: git diff --exit-code
      - run: make lint
      - run: make test
      - run: make test-integration
        env:
          DATABASE_URL: postgres://invoiceflow:invoiceflow@127.0.0.1:5432/invoiceflow?sslmode=disable
      # This job installs no Node toolchain; the frontend job builds the bundle.
      - run: make build-go

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
