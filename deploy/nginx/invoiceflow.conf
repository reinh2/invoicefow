# nginx reverse proxy for a public InvoiceFlow demo (ADR-016).
#
# This file carries the *real* per-visitor rate limit. The in-process limiter
# (UPLOAD_RATE_PER_MINUTE) deliberately ignores X-Forwarded-For, because any
# caller can set one — which means that behind this proxy every request reaches
# the application with the same peer address and the in-process limit bounds the
# instance as a whole. Per-visitor limiting has to happen here, where
# $binary_remote_addr is still the actual client.
#
# Install:
#   sudo cp deploy/nginx/invoiceflow.conf /etc/nginx/sites-available/invoiceflow
#   sudo ln -s /etc/nginx/sites-available/invoiceflow /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace DEMO_HOSTNAME with the hostname the certificate is issued for.
# TLS is obtained with certbot (see docs/DEPLOYMENT.md); until it has run, the
# 443 server block below will not start, so run certbot before enabling this.

# Two zones, because the two kinds of traffic have nothing in common. Browsing
# the app is chatty — the bundle, the document list, and a 1.5 s webhook status
# poll. Uploading is expensive: each accepted file runs poppler and possibly
# tesseract in the worker.
limit_req_zone $binary_remote_addr zone=invoiceflow_browse:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=invoiceflow_upload:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=invoiceflow_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name DEMO_HOSTNAME;

    # certbot's HTTP-01 challenge must stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name DEMO_HOSTNAME;

    ssl_certificate     /etc/letsencrypt/live/DEMO_HOSTNAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DEMO_HOSTNAME/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # The application already sets its own CSP, nosniff, and Referrer-Policy on
    # every response (ADR-013); this adds only what a proxy is responsible for.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The API rejects anything above 20 MiB and the request above 21 MiB, so the
    # proxy refuses first and the application never reads a body it will discard.
    client_max_body_size 21m;
    # Buffer the upload here rather than trickling it to the API: the server's
    # ReadTimeout is 10 s, which a slow client would otherwise exceed on a large
    # file even though the file itself is acceptable.
    proxy_request_buffering on;

    limit_conn invoiceflow_conn 24;
    # burst absorbs the natural bursts of loading a page; nodelay serves them
    # immediately instead of queueing, and anything beyond gets 429.
    limit_req zone=invoiceflow_browse burst=40 nodelay;
    limit_req_status 429;
    limit_conn_status 429;

    # Uploads are the only expensive, state-creating route, so they get their own
    # much stricter budget on top of the browse limit.
    location = /api/v1/documents {
        limit_req zone=invoiceflow_browse burst=40 nodelay;
        limit_req zone=invoiceflow_upload burst=3 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # Set for the access log and for any future proxy in front. The
        # application deliberately does not trust X-Forwarded-For (ADR-016); it
        # is passed on for completeness, not as an authorization input.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Extraction is asynchronous, but a CSV export and the source-document
        # stream are not; 60 s is comfortably above the API's own 15 s write
        # timeout without letting a stuck upstream hold a connection forever.
        proxy_read_timeout 60s;
    }

    # The metrics endpoint (ADR-017) is bound inside the compose network and is
    # deliberately not proxied here. Reach it with
    # `docker compose exec worker wget -qO- 127.0.0.1:9090/metrics`, or over an
    # SSH tunnel. It has no authentication and reveals traffic volume.
}
